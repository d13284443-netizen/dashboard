<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vol Desk — Gold Options IV Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Vol Desk — design tokens
   Dark base for a screen watched during market hours. One
   saturated color family (severity red/amber/blue) reserved
   entirely for spike events, so urgency reads instantly. The
   single teal accent marks interactive/live state only.
   ============================================================ */
:root {
  --bg:        #0E1214;
  --panel:     #161B1E;
  --panel-2:   #1B2225;
  --border:    #2C3338;
  --border-lt: #3A4046;
  --text:      #EDEBE6;
  --text-dim:  #8A9199;
  --text-faint:#5A6169;
  --accent:    #4A9B7F;
  --accent-dim:#2E5F4E;
  --high:      #E5484D;
  --warn:      #E8913A;
  --info:      #4C88C4;
  --high-bg:   rgba(229,72,77,0.10);
  --warn-bg:   rgba(232,145,58,0.10);
  --info-bg:   rgba(76,136,196,0.10);
  --up:        #4A9B7F;
  --down:      #E5484D;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --serif: 'Fraunces', Georgia, serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: no-preference) {
  .fade-in { animation: fade 0.3s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}

/* ---- Login ---- */
#login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-card {
  width: 100%;
  max-width: 360px;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 40px 32px;
}
.login-card h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 30px;
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.login-card .sub {
  color: var(--text-dim);
  font-size: 12px;
  margin-bottom: 28px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  color: var(--text-dim);
  font-size: 11px;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border-lt);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px 12px;
  outline: none;
}
.field input:focus { border-color: var(--accent); }
button.primary {
  width: 100%;
  background: var(--accent);
  color: #0A0D0E;
  border: none;
  font-family: var(--mono);
  font-weight: 600;
  font-size: 13px;
  padding: 11px;
  cursor: pointer;
  margin-top: 4px;
}
button.primary:hover { background: #57ad8f; }
button.primary:disabled { opacity: 0.5; cursor: default; }
.login-error {
  color: var(--high);
  font-size: 12px;
  margin-top: 14px;
  min-height: 16px;
}

/* ---- App shell ---- */
#app { display: none; }
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.brand {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 18px;
  letter-spacing: -0.01em;
}
.brand span { color: var(--accent); }
.health-dot {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--text-dim);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
.dot.ok { background: var(--accent); }
.dot.stale { background: var(--warn); }
.dot.dead { background: var(--high); }
.spacer { flex: 1; }
.topbar .who { color: var(--text-dim); font-size: 11px; }
.topbar button.ghost {
  background: none;
  border: 1px solid var(--border-lt);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 12px;
  cursor: pointer;
}
.topbar button.ghost:hover { color: var(--text); border-color: var(--text-dim); }

.tabs {
  display: flex;
  gap: 0;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 12px;
  padding: 11px 16px;
  cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

.view { display: none; padding: 20px; }
.view.active { display: block; }

/* ---- Chain layout: main table + spike strip ---- */
.chain-layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) {
  .chain-layout { grid-template-columns: 1fr; }
}

.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
select {
  background: var(--panel-2);
  border: 1px solid var(--border-lt);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 10px;
  outline: none;
  cursor: pointer;
}
select:focus { border-color: var(--accent); }

.meta-row {
  display: flex;
  gap: 24px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.stat .k { color: var(--text-faint); font-size: 10px; }
.stat .v {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

/* ---- Tables ---- */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
}
.panel-head {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
table { width: 100%; border-collapse: collapse; }
th {
  text-align: right;
  color: var(--text-faint);
  font-weight: 400;
  font-size: 10px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--panel);
}
th.l, td.l { text-align: left; }
td {
  text-align: right;
  padding: 6px 10px;
  border-bottom: 1px solid rgba(44,51,56,0.5);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
tr:hover td { background: var(--panel-2); }
td.strike { color: var(--text); font-weight: 500; }
td.dim { color: var(--text-dim); }
td.call { color: #cfe3da; }
td.put  { color: #e3d3cf; }
.atm-row td { background: rgba(74,155,127,0.07); }
.atm-row td.strike { color: var(--accent); }
.table-scroll { max-height: 620px; overflow-y: auto; }

/* ---- Spike feed ---- */
.spike {
  border-left: 3px solid var(--text-faint);
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.spike.high { border-left-color: var(--high); background: var(--high-bg); }
.spike.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.spike.info { border-left-color: var(--info); background: var(--info-bg); }
.spike-top { display: flex; justify-content: space-between; align-items: baseline; }
.spike-title { font-size: 12px; font-weight: 500; }
.spike-time { color: var(--text-faint); font-size: 10px; }
.spike-nums { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
.spike-nums b { color: var(--text); font-weight: 500; }
.suppress-tag {
  display: inline-block;
  margin-top: 6px;
  font-size: 10px;
  color: var(--warn);
  border: 1px solid var(--warn);
  padding: 1px 6px;
}
.chg-up { color: var(--up); }
.chg-down { color: var(--down); }

/* ---- Filter chips ---- */
.chips { display: flex; gap: 6px; }
.chip {
  background: none;
  border: 1px solid var(--border-lt);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 10px;
  padding: 3px 9px;
  cursor: pointer;
}
.chip.on { color: var(--text); border-color: var(--accent); background: rgba(74,155,127,0.1); }

/* ---- Chart ---- */
.chart-wrap { padding: 16px; }
svg .grid { stroke: var(--border); stroke-width: 1; }
svg .axis-label { fill: var(--text-faint); font-size: 10px; font-family: var(--mono); }
svg .series-line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
svg .atm-line { fill: none; stroke: var(--info); stroke-width: 1.5; stroke-dasharray: 4 3; }

/* ---- Health / log ---- */
.log-line { padding: 5px 12px; border-bottom: 1px solid rgba(44,51,56,0.5); font-size: 11px; display: flex; gap: 12px; }
.log-line .lvl { width: 48px; flex-shrink: 0; }
.log-line .lvl.error { color: var(--high); }
.log-line .lvl.warn { color: var(--warn); }
.log-line .lvl.info { color: var(--text-faint); }
.log-line .ts { color: var(--text-faint); flex-shrink: 0; }

.empty { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 12px; }
.loading { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>

<!-- Login gate -->
<div id="login">
  <div class="login-card">
    <h1>Vol Desk</h1>
    <div class="sub">Gold options IV monitor</div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="primary" id="login-btn">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <div class="brand">Vol<span>Desk</span></div>
    <div class="health-dot"><span class="dot" id="health-dot"></span><span id="health-text">checking…</span></div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="ghost" id="logout">Sign out</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="chain">Chain</button>
    <button class="tab" data-view="history">IV History</button>
    <button class="tab" data-view="spikes">Spike Log</button>
    <button class="tab" data-view="system">System</button>
  </div>

  <!-- Chain view -->
  <div class="view active" id="view-chain">
    <div class="controls">
      <select id="chain-series"></select>
    </div>
    <div class="meta-row" id="chain-meta"></div>
    <div class="chain-layout">
      <div class="panel">
        <div class="panel-head"><span>Option chain</span><span id="chain-updated"></span></div>
        <div class="table-scroll">
          <table id="chain-table">
            <thead><tr>
              <th class="l">C OI</th><th>C Δ</th><th>C IV</th>
              <th class="strike-col">Strike</th>
              <th>P IV</th><th>P Δ</th><th class="l">P OI</th>
            </tr></thead>
            <tbody id="chain-body"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>Recent spikes</span></div>
        <div id="chain-spikes" class="table-scroll"></div>
      </div>
    </div>
  </div>

  <!-- History view -->
  <div class="view" id="view-history">
    <div class="controls">
      <select id="hist-series"></select>
      <select id="hist-strike"></select>
      <select id="hist-side">
        <option value="c">Calls</option>
        <option value="p">Puts</option>
      </select>
      <select id="hist-window">
        <option value="24">Last 24h</option>
        <option value="72">Last 3 days</option>
        <option value="168">Last 7 days</option>
      </select>
    </div>
    <div class="panel">
      <div class="panel-head"><span id="hist-title">IV history</span></div>
      <div class="chart-wrap" id="hist-chart"></div>
    </div>
  </div>

  <!-- Spikes view -->
  <div class="view" id="view-spikes">
    <div class="controls">
      <select id="spike-series"><option value="">All expiries</option></select>
      <div class="chips">
        <button class="chip on" data-filter="all">All</button>
        <button class="chip" data-filter="real">Vol events only</button>
        <button class="chip" data-filter="suppressed">Would-suppress</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <span>Detections</span>
        <span id="spike-count"></span>
      </div>
      <div id="spike-list"></div>
    </div>
  </div>

  <!-- System view -->
  <div class="view" id="view-system">
    <div class="chain-layout">
      <div class="panel">
        <div class="panel-head"><span>Worker health</span></div>
        <div id="health-panel"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>Recent log</span></div>
        <div class="table-scroll" id="log-panel"></div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
